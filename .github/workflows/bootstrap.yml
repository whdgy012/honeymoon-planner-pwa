name: Restore PWA package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify package
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/pwa.zip.part* > /tmp/honeymoon-pwa.zip
          echo "f596d92352e307ef09bcf987a5f1c4c40beffa4ca1aeed30c79874453001046b  /tmp/honeymoon-pwa.zip" | sha256sum -c -
          unzip -oq /tmp/honeymoon-pwa.zip -d .
          rm -rf .payload
          rm -f .github/workflows/pages.yml README.md
      - name: Commit restored app files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add installable honeymoon planner PWA"
          git push

name: Apply next-schedule route update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    if: ${{ hashFiles('.updates/route.patch') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified route update
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .updates/route.patch
          git apply --whitespace=nowarn .updates/route.patch
          rm -rf .updates
      - name: Commit route feature
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add current-location route to next schedule"
          git push

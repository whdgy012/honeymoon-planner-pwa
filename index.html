button,a,input,summary{-webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.brand small,.section-title span,.hero .eyebrow,.hero-mini span,.date-btn span,.swipe-hint,.day-head p,.event p,.cost small,.map-status,.place-row,.place-warning,.map-meta span,.notice,.money-card small,.cash-card small,.money-card p,.cash-card p,.budget-row span,.edit-note,.res-card p,.sheet p{font-size:12px;line-height:1.5}
.hero p,.event h4,.route-focus-label b,.budget-row b,.budget-row strong,.res-card h4{font-size:14px}
.section-title h3{font-size:18px}.hero .eyebrow{letter-spacing:.08em}.hero-mini span{opacity:.86}.hero-mini b{font-size:18px}
.install-btn,.filter-btn,.map-tab,.map-day,.mode-tab,.map-tool,.place-action,.save-btn,.reset-btn,.link-btn,.date-btn{min-height:44px;font-size:12px}
.done-btn,.edit-mini{min-width:44px;min-height:44px}.done-btn{width:44px;height:44px}.edit-mini{padding:8px 12px}
.chip,.status{font-size:11px;line-height:1.3;padding:6px 9px}
.nav{font-size:12px;min-height:54px}.nav i{font-size:21px}.nav.active{position:relative}.nav.active:after{content:"";position:absolute;left:30%;right:30%;bottom:1px;height:3px;border-radius:99px;background:var(--teal)}
.date-btn{min-width:64px}.date-btn b{font-size:15px}.date-btn .mini-progress{font-size:11px}.filter-row{gap:8px}.filter-btn{padding:9px 13px}
.day-nav{width:44px;height:44px}.event{padding:14px}.event-time{font-size:12px}.event p{color:#536474}.timeline{padding-left:21px}
.day-checklist{margin:0 0 10px;padding:11px 13px;border:1px solid #cfe2dc;background:var(--surface-soft);border-radius:14px;color:#285c54;font-size:12px;line-height:1.45}
.day-checklist b{display:block;color:var(--teal);font-size:13px;margin-bottom:3px}
.travel-brief{display:block;margin-top:10px;border:1px solid #ded8ce;border-radius:13px;background:#fbfaf7;overflow:hidden}
.travel-brief>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;padding:9px 12px;color:var(--ink);font-size:12px;font-weight:700;list-style:none}
.travel-brief>summary::-webkit-details-marker{display:none}.travel-brief>summary:after{content:"＋";margin-left:auto;color:var(--teal);font-size:17px}.travel-brief[open]>summary:after{content:"−"}
.travel-brief-content{display:grid;gap:8px;padding:0 9px 9px}.brief-box{display:block!important;font-size:12px;line-height:1.55;padding:10px 11px}.brief-box b{display:block;font-size:12px;margin-bottom:4px}
.next-card{margin-top:12px;background:#fff;border:1px solid rgba(12,111,118,.25);border-radius:20px;padding:15px;box-shadow:0 10px 28px rgba(15,46,82,.08)}
.next-card-eyebrow{font-size:12px;color:var(--teal);font-weight:700}.next-card h3{font-size:19px;color:var(--ink);margin:5px 0 3px;line-height:1.3}.next-card p{font-size:13px;color:var(--muted);margin:0}
.next-card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.next-card-actions button{min-height:48px;border:0;border-radius:13px;font-size:13px;font-weight:700}.next-card-actions .primary{background:var(--teal);color:#fff}.next-card-actions .secondary{background:#eef2f2;color:var(--ink)}
.map-tabs,.map-days,.mode-tabs{gap:8px}.route-number{width:36px;height:36px;font-size:13px}.route-stop{min-height:48px;min-width:110px;font-size:11px;padding:8px 10px}.route-stop strong{font-size:12px}.route-focus-label small{font-size:11px}.map-route-legend{font-size:12px;line-height:1.45;padding-top:2px}
.map-toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.map-tool{display:flex;align-items:center;justify-content:center;min-height:46px;font-size:12px;text-align:center}.map-tool.route-next{grid-column:1/-1;order:-3;background:var(--teal);border-color:var(--teal);font-size:14px;min-height:52px}.map-tool.primary{background:var(--ink)}
.map-status{padding:2px 12px 12px;font-size:12px;line-height:1.45}.place-info.loading{font-size:12px}.place-info-title h4{font-size:15px}.place-source{font-size:11px}.place-row{grid-template-columns:76px 1fr;font-size:12px}.place-warning{font-size:12px}
.route-ux-note{padding:10px 12px;background:#eef6f3;border-bottom:1px solid #d7e7e1;color:#315c55;font-size:12px;line-height:1.45}.route-ux-note b{color:var(--teal)}
.infographic-zoom-hint{font-size:12px;padding:9px 11px}.infographic-head small{font-size:11px}.infographic-head b{font-size:16px}.infographic-head button{width:44px;height:44px}.infographic-controls button{font-size:13px}
.reserve-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.reserve-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center}.reserve-stat b{display:block;font-size:18px;color:var(--ink)}.reserve-stat span{font-size:11px;color:var(--muted)}
.reserve-filters{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.reserve-filter{flex:none;min-height:44px;border:1px solid #d8d1c6;background:#fff;border-radius:999px;padding:8px 13px;color:#596775;font-size:12px;font-weight:700}.reserve-filter.active{background:var(--teal);border-color:var(--teal);color:#fff}
.confirmed-details{margin-bottom:12px}.confirmed-details summary{min-height:46px;padding:0 13px;border:1px solid var(--line);background:#fff;border-radius:14px;color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center}.confirmed-details .card{margin-top:7px}
.empty-card{text-align:center;padding:24px 14px;color:var(--muted);font-size:13px}
.money-input-wrap{display:flex;align-items:center;gap:7px}.money-input-wrap span{font-size:12px;color:var(--muted);min-width:18px}.budget-input{width:140px;min-height:46px;font-size:16px}.budget-actions button{min-height:46px}.barline{height:10px}
.offline-map-note{display:none}.pwa-status.offline~main .offline-map-note{display:block}
@media(min-width:390px){.travel-brief-content{grid-template-columns:1fr 1fr}}
@media(min-width:900px){body{padding:18px 0}.app{max-width:760px}.bottom{width:min(760px,100%)}#liveMap{height:500px}.hero-grid{grid-template-columns:repeat(4,1fr)}.next-card-actions{grid-template-columns:1.2fr .8fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

function commonDayPrep(events){
  const list=['여권 또는 신분증','휴대폰','보조배터리','물'];
  if(events.some(e=>/항공/.test(e.type)))list.push('탑승권','수하물 규정 확인');
  if(events.some(e=>/관광|투어/.test(e.type)))list.push('예약 QR','편한 신발');
  if(events.some(e=>/숙박|체크인/.test(e.type)))list.push('숙소 예약 확인서');
  return [...new Set(list)].join(' · ')
}

<script>
(function(){
  if(window.__honeymoonPWAInit)return; window.__honeymoonPWAInit=true;
  const installBtn=document.getElementById('installBtn');
  const modal=document.getElementById('installModal');
  const closeBtn=document.getElementById('installClose');
  const status=document.getElementById('pwaStatus');
  const statusText=document.getElementById('pwaStatusText');
  const updateBtn=document.getElementById('pwaUpdateBtn');
  let deferredPrompt=null;
  const ua=navigator.userAgent||'';
  const isIOS=/iPad|iPhone|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const standalone=()=>window.matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
  function showInstallButton(){ if(!standalone()) installBtn?.classList.add('show'); }
  function updateNetwork(){
    if(!status||!statusText)return;
    if(!navigator.onLine){status.classList.add('show','offline');statusText.textContent='오프라인 모드 · 일정/예산/완료체크는 계속 사용할 수 있습니다.';}
    else{status.classList.remove('offline'); if(standalone()){status.classList.add('show');statusText.textContent='앱으로 실행 중 · 지도 상세정보는 인터넷 연결 시 최신 정보를 불러옵니다.';} else status.classList.remove('show');}
  }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;showInstallButton();});
  window.addEventListener('appinstalled',()=>{deferredPrompt=null;installBtn?.classList.remove('show'); if(status){status.classList.add('show');statusText.textContent='설치 완료 · 홈 화면에서 신혼여행 플래너를 실행할 수 있습니다.';}});
  installBtn?.addEventListener('click',async()=>{
    if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){} deferredPrompt=null;installBtn.classList.remove('show');return;}
    document.getElementById('installIOS').style.display=isIOS?'block':'none';
    document.getElementById('installGeneric').style.display=isIOS?'none':'block';
    modal?.classList.add('show');
  });
  closeBtn?.addEventListener('click',()=>modal?.classList.remove('show'));
  modal?.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('show')});
  window.addEventListener('online',updateNetwork); window.addEventListener('offline',updateNetwork);
  if(isIOS&&!standalone())showInstallButton();
  updateNetwork();
  if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const worker=reg.installing; if(!worker)return;
        worker.addEventListener('statechange',()=>{if(worker.state==='installed'&&navigator.serviceWorker.controller&&status){status.classList.add('show');statusText.textContent='새 버전이 준비되었습니다.';updateBtn.style.display='inline-flex';updateBtn.onclick=()=>{worker.postMessage({type:'SKIP_WAITING'});};}});
      });
    }).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
  }
})();
</script>
